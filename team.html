<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>師生協作團隊 — 花中九十校慶義賣</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@300;400;600;700&family=Noto+Sans+TC:wght@300;400;500&family=Cormorant+Garamond:ital,wght@0,300;1,300&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing:border-box; margin:0; padding:0; }

  :root {
    --gold:#C8A44A; --gold-lt:#E8C870; --gold-dk:#8A6820;
    --ink:#1A1814; --ink-mid:#3A3530;
    --body-bg:#111008;
    --card-bg:#1e1c14;
    --page-bg:#F5F0E4;
    --text-primary:#1a1a1a;
    --text-secondary:#5a5040;
    --text-muted:#9a8868;
    --divider:rgba(200,164,74,0.25);
    --member-bg:#f9f5eb;
    --member-border:rgba(200,164,74,0.3);
    --photo-shadow:rgba(0,0,0,0.14);
  }
  body.light {
    --body-bg:#e8e4da;
    --card-bg:#ffffff;
    --page-bg:#ffffff;
    --text-primary:#1a1208;
    --text-secondary:#4a3a28;
    --text-muted:#7a6848;
    --divider:rgba(160,120,40,0.25);
    --member-bg:#fff8ee;
    --member-border:rgba(180,140,50,0.3);
    --photo-shadow:rgba(0,0,0,0.10);
  }

  body {
    font-family:'Noto Sans TC',sans-serif;
    background:var(--body-bg);
    display:flex; flex-direction:column; align-items:center;
    min-height:100vh; padding:1rem 1rem 3rem;
    transition:background 0.3s;
  }

  /* ctrl bar */
  .ctrl-bar {
    width:100%; max-width:680px;
    display:flex; justify-content:flex-end; gap:6px; margin-bottom:0.6rem;
  }
  .ctrl-btn {
    font-size:11px; padding:4px 12px; border-radius:99px; cursor:pointer;
    border:1px solid rgba(200,164,74,0.4);
    background:rgba(200,164,74,0.08); color:rgba(200,164,74,0.85);
    transition:background 0.15s; letter-spacing:0.06em;
  }
  .ctrl-btn:hover, .ctrl-btn.active {
    background:rgba(200,164,74,0.22); color:#E8C870;
  }
  body.light .ctrl-btn { border-color:rgba(140,100,20,0.4); background:rgba(140,100,20,0.08); color:#7a5a18; }
  body.light .ctrl-btn:hover, body.light .ctrl-btn.active { background:rgba(140,100,20,0.20); color:#5a3a08; }

  /* back btn */
  .back-btn { width:100%; max-width:680px; margin-bottom:0.5rem; }
  .back-btn a {
    display:inline-flex; align-items:center; gap:5px;
    font-size:12px; color:rgba(200,164,74,0.75); text-decoration:none;
    padding:4px 2px; letter-spacing:0.05em; transition:color 0.15s;
  }
  .back-btn a:hover { color:var(--gold-lt); }
  .back-btn a::before { content:'←'; font-size:13px; }

  /* main wrap */
  .wrap { width:100%; max-width:680px; }

  /* ── HERO HEADER ── */
  .hero {
    background:var(--ink);
    border-radius:16px 16px 0 0;
    padding:2.2rem 2.5rem 1.8rem;
    position:relative; overflow:hidden;
  }
  .hero-bg {
    position:absolute; inset:0;
    background:radial-gradient(ellipse at 20% 60%,rgba(200,164,74,0.12) 0%,transparent 55%),
               radial-gradient(ellipse at 85% 20%,rgba(200,164,74,0.08) 0%,transparent 50%);
  }
  .gold-line { width:60px; height:1px; background:linear-gradient(to right,transparent,var(--gold),transparent); margin:0.8rem auto; position:relative; z-index:2; }
  .hero-label { font-family:'Noto Serif TC',serif; font-size:10px; color:rgba(200,164,74,0.7); letter-spacing:0.3em; text-align:center; position:relative; z-index:2; margin-bottom:0.4rem; }
  .hero-title { font-family:'Noto Serif TC',serif; font-size:26px; font-weight:700; color:var(--gold-lt); text-align:center; letter-spacing:0.12em; position:relative; z-index:2; line-height:1.3; }
  .hero-sub { font-family:'Cormorant Garamond',serif; font-size:14px; font-style:italic; color:rgba(232,200,112,0.6); text-align:center; letter-spacing:0.1em; margin-top:0.3rem; position:relative; z-index:2; }
  .hero-desc { font-size:12px; color:rgba(245,240,228,0.5); text-align:center; letter-spacing:0.1em; margin-top:0.6rem; position:relative; z-index:2; line-height:1.8; }

  /* ── MEMBER SECTION ── */
  .section {
    background:var(--page-bg);
    padding:1.8rem 2rem;
    transition:background 0.3s;
  }
  .section + .section { border-top:1px solid var(--divider); }
  .section-header { display:flex; align-items:center; gap:10px; margin-bottom:1.2rem; }
  .section-icon { font-size:18px; }
  .section-title {
    font-family:'Noto Serif TC',serif; font-size:14px; font-weight:700;
    color:var(--gold-dk); letter-spacing:0.15em;
  }
  .section-count { font-size:11px; color:var(--text-muted); margin-left:auto; letter-spacing:0.08em; }

  .member-grid { display:flex; flex-wrap:wrap; gap:8px; }
  .member-chip {
    display:flex; align-items:center; gap:7px;
    background:var(--member-bg); border:1px solid var(--member-border);
    border-radius:99px; padding:7px 14px;
    transition:background 0.3s, border 0.3s;
  }
  .member-avatar {
    width:28px; height:28px; border-radius:50%;
    background:linear-gradient(135deg,var(--gold-dk),var(--gold));
    display:flex; align-items:center; justify-content:center;
    font-size:11px; font-weight:700; color:#fff; flex-shrink:0;
    font-family:'Noto Serif TC',serif;
  }
  .member-avatar.student {
    background:linear-gradient(135deg,#3a3020,#6a5030);
  }
  .member-name { font-size:13px; font-weight:500; color:var(--text-primary); letter-spacing:0.04em; transition:color 0.3s; }
  .member-name-en { font-size:10px; color:var(--text-muted); letter-spacing:0.04em; }

  /* ── PHOTO GALLERY ── */
  .gallery-section {
    background:var(--page-bg);
    padding:1.8rem 2rem;
    border-top:1px solid var(--divider);
    transition:background 0.3s;
  }
  .gallery-title-row { display:flex; align-items:center; gap:10px; margin-bottom:1.2rem; }
  .gallery-label {
    font-family:'Noto Serif TC',serif; font-size:14px; font-weight:700;
    color:var(--gold-dk); letter-spacing:0.15em;
  }

  .photo-grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .photo-item { position:relative; border-radius:10px; overflow:hidden; cursor:pointer; }
  .photo-item.wide { grid-column:span 2; }
  .photo-item img {
    width:100%; height:100%; object-fit:cover; display:block;
    transition:transform 0.35s ease;
    box-shadow:0 4px 16px var(--photo-shadow);
  }
  .photo-item:hover img { transform:scale(1.03); }
  .photo-item { height:200px; }
  .photo-item.wide { height:240px; }

  /* lightbox */
  .lightbox {
    position:fixed; inset:0; background:rgba(0,0,0,0.88);
    display:flex; align-items:center; justify-content:center;
    z-index:100; opacity:0; pointer-events:none; transition:opacity 0.2s;
  }
  .lightbox.open { opacity:1; pointer-events:all; }
  .lightbox img { max-width:92vw; max-height:88vh; border-radius:8px; object-fit:contain; }
  .lightbox-close {
    position:absolute; top:16px; right:20px;
    font-size:28px; color:rgba(255,255,255,0.7); cursor:pointer;
    background:none; border:none; line-height:1;
  }

  /* ── FOOTER ── */
  .team-footer {
    background:var(--ink); border-radius:0 0 16px 16px;
    padding:1.2rem 2rem; text-align:center;
  }
  .team-footer p { font-size:11px; color:rgba(200,164,74,0.5); letter-spacing:0.12em; font-family:'Noto Serif TC',serif; line-height:2; }
</style>
</head>
<body>

<div class="ctrl-bar">

  <button class="ctrl-btn" id="btn-dark" onclick="setMode('dark')">🌙 深色</button>
  <button class="ctrl-btn" id="btn-light" onclick="setMode('light')">☀️ 淺色</button>
</div>

<div class="back-btn">

      <div class="photo-item wide" onclick="openLightbox('team4.jpg')"><img src="team4.jpg" alt="師生合影" loading="lazy"></div>

<div class="lightbox" id="lightbox" onclick="closeLightbox()">
  <button class="lightbox-close" onclick="closeLightbox()">✕</button>

</div>

<script>
  function setLang(lang) {
    const langMap = { zh:'zh-TW', en:'en', ja:'ja' };
    document.documentElement.lang = langMap[lang] || 'zh-TW';
    ['zh','en','ja'].forEach(l => {
      document.getElementById('btn-' + l).classList.toggle('active', l === lang);
    });
    document.querySelectorAll('[data-zh]').forEach(el => {
      const val = el.getAttribute('data-' + lang);
      if (val !== null) el.innerHTML = val;
    });
    const titles = {
      zh: '師生協作團隊 — 花中九十校慶義賣',
      en: 'Student-Teacher Team — HLHS 90th Anniversary',
      ja: '師生協働チーム — 花蓮高中 創立90周年'
    };
    document.title = titles[lang];
  }
  function setMode(mode) {
    document.body.classList.toggle('light', mode === 'light');
    document.getElementById('btn-dark').classList.toggle('active', mode === 'dark');
    document.getElementById('btn-light').classList.toggle('active', mode === 'light');
  }
  function openLightbox(src) {
    document.getElementById('lightbox-img').src = src;
    document.getElementById('lightbox').classList.add('open');
  }
  function closeLightbox() {
    document.getElementById('lightbox').classList.remove('open');
  }
  document.addEventListener('keydown', e => { if (e.key === 'Escape') closeLightbox(); });
  setLang('zh');
  setMode('dark');
</script>
</body>
</html>
